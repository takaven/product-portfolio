name: Portfolio Governance Change
description: Required for product status, priority, boundary, source hierarchy or archive/component changes.
title: "[Governance] TKV-000 - proposed change"
labels: ["governance"]
body:
  - type: input
    id: product_id
    attributes:
      label: Product ID
      placeholder: TKV-003
    validations:
      required: true
  - type: dropdown
    id: change_type
    attributes:
      label: Change type
      options:
        - status
        - priority
        - product boundary
        - canonical source
        - archive state
        - component state
        - condition to clear
        - other governance change
    validations:
      required: true
  - type: textarea
    id: current_state
    attributes:
      label: Current canonical state
      description: Quote or summarise the current state from PORTFOLIO.yaml.
    validations:
      required: true
  - type: textarea
    id: proposed_state
    attributes:
      label: Proposed canonical state
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Distinguish VERIFIED, INFERRED and UNVERIFIED claims.
    validations:
      required: true
  - type: dropdown
    id: review_classification
    attributes:
      label: Review classification
      description: Use BLOCKING or MATERIAL for changes that alter execution; use NON_BLOCKING or COSMETIC only for non-state corrections.
      options:
        - BLOCKING
        - MATERIAL
        - NON_BLOCKING
        - COSMETIC
    validations:
      required: true
  - type: textarea
    id: approval_authority
    attributes:
      label: Approval authority
      description: Name the founder/governance approval or linked decision record authorising this change.
    validations:
      required: true
  - type: textarea
    id: final_endpoint
    attributes:
      label: Final endpoint
      description: State the exact registry or documentation state after the change, and where the agent must stop.
    validations:
      required: true
  - type: checkboxes
    id: acknowledgement
    attributes:
      label: Acknowledgement
      options:
        - label: This change does not reopen portfolio discovery unless explicitly authorised under PORTFOLIO.yaml new-product policy.
          required: true
        - label: I understand ordinary implementation PRs must not silently change canonical portfolio state.
          required: true
