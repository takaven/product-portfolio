name: Execution Phase
description: Bounded authorised product execution work.
title: "[Execution] TKV-000 - phase name"
labels: ["execution"]
body:
  - type: input
    id: product_id
    attributes:
      label: Product ID
      description: Use the canonical ID from PORTFOLIO.yaml.
      placeholder: TKV-003
    validations:
      required: true
  - type: input
    id: execution_phase
    attributes:
      label: Execution phase
      placeholder: Phase 1 - Sanitisation and foundation extraction
    validations:
      required: true
  - type: textarea
    id: source_documents
    attributes:
      label: Source-of-truth documents
      description: List the portfolio/product documents the agent must read.
    validations:
      required: true
  - type: textarea
    id: source_asset_locator
    attributes:
      label: Actual source asset locator
      description: Provide repository URL, Replit/export/local locator, and any access notes needed to locate the exact source without chat history.
    validations:
      required: true
  - type: input
    id: source_revision
    attributes:
      label: Branch / revision / pinned commit
      description: Provide branch and commit SHA where applicable. Use LOCATOR_REQUIRED only when this issue is specifically to resolve missing locator evidence.
      placeholder: main @ abc123... or LOCATOR_REQUIRED
    validations:
      required: true
  - type: dropdown
    id: source_evidence_status
    attributes:
      label: Source evidence status
      options:
        - VERIFIED
        - INFERRED
        - UNVERIFIED
        - LOCATOR_REQUIRED
    validations:
      required: true
  - type: textarea
    id: objective
    attributes:
      label: Objective
      description: Define the bounded outcome.
    validations:
      required: true
  - type: textarea
    id: final_endpoint
    attributes:
      label: Final endpoint
      description: State exactly where the agent must stop when the issue is complete.
    validations:
      required: true
  - type: textarea
    id: allowed_changes
    attributes:
      label: Allowed changes
      description: State what may be changed.
    validations:
      required: true
  - type: textarea
    id: explicit_exclusions
    attributes:
      label: Explicit exclusions
      description: State what must not be changed.
    validations:
      required: true
  - type: textarea
    id: acceptance_criteria
    attributes:
      label: Acceptance criteria
    validations:
      required: true
  - type: textarea
    id: evidence_required
    attributes:
      label: Evidence required
      description: Tests, screenshots, logs, review notes or other proof.
    validations:
      required: true
  - type: checkboxes
    id: status_update
    attributes:
      label: Status update requirement
      options:
        - label: This issue is authorised by the current execution gate in PORTFOLIO.yaml.
          required: true
        - label: This issue states whether PORTFOLIO.yaml or product docs may be updated.
          required: true
        - label: The agent must stop at this issue's acceptance gate.
          required: true
        - label: The source locator and revision are sufficient for an independent agent to find the source without historical chat context, unless this issue is explicitly about resolving missing locator evidence.
          required: true
