name: Portfolio Validation

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install validation dependencies
        run: python -m pip install -r requirements.txt

      - name: Validate portfolio registry
        run: python scripts/validate_portfolio.py

      - name: Validate PR governance metadata
        if: github.event_name == 'pull_request'
        run: python scripts/validate_pr_governance.py

      - name: Validate portfolio transitions
        if: github.event_name == 'pull_request'
        run: python scripts/validate_portfolio_transitions.py --base-ref origin/${{ github.base_ref }} --head-ref HEAD

      - name: Check generated portfolio view
        run: python scripts/generate_portfolio.py --check

      - name: Check generated dashboard
        run: python scripts/generate_dashboard.py --check

      - name: Check generated product docs
        run: python scripts/generate_product_docs.py --check

      - name: Run validation failure-case tests
        run: python scripts/test_validation_cases.py

      - name: Run automation governance tests
        run: python scripts/test_automation_cases.py

      - name: Check documentation links
        run: python scripts/check_docs.py
